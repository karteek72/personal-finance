server {
    listen 3000;
    listen [::]:3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Avoid 301 redirects to internal :3000 when behind Cloudflare (breaks OAuth callbacks).
    absolute_redirect off;
    port_in_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # SnapTrade redirects to /callback without a trailing slash.
    location = /accounts/snaptrade/callback {
        try_files /accounts/snaptrade/callback/index.html =404;
    }

    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
