  - id: TASK-CALC-001
    title: Fix C1 — day-of-week 'average' is a lifetime sum
    status: done
    priority: P1
    area: backend
    phase: 3.7
    assignee: null
    claimed_at: null
    dependencies: []
    source_docs:
      - docs/architecture/analytics-architecture.md
      - backend/src/services/compute-patterns.ts
      - ui/src/components/preview/panels/patterns-panel.tsx
    description: |
      The Patterns panel labels a chart "Average spend by day of week" but
      compute-patterns.ts (lines ~27-52) runs SUM(amount) grouped by extract(dow from date)
      over ALL history with no division. So each weekday shows the lifetime total of every
      occurrence of that weekday — the numbers are far too large.

      Fix: return the AVERAGE spend per occurrence of that weekday over the data window:
        value = SUM(amount) / COUNT(DISTINCT date)   -- per dow group
      (i.e. on a typical Monday, how much is spent). Keep the same filters already present
      (expense, not transfer, not internal-transfer category, not pending). Do NOT change the
      UI label unless you switch the metric; data and label must agree. The weekday/weekend
      comparison in patterns-panel.tsx (lines ~41-46) is derived from these values and will
      become correct once the per-day numbers are averages.
    acceptance_criteria:
      - dayOfWeek values are average-per-weekday-occurrence, not lifetime sums
      - Division guards against zero occurrences (no NaN/Infinity)
      - Existing filters preserved; UI label matches the metric
      - A unit/integration check with a small fixture confirms the average math
  - id: TASK-CALC-002
    title: Fix C2 — inverted wellness scores for lower-is-better dimensions
    status: done
    priority: P1
    area: backend
    phase: 3.7
    assignee: null
    claimed_at: null
    dependencies: []
    source_docs:
      - docs/architecture/analytics-architecture.md
      - backend/src/services/compute-wellness.ts
    description: |
      scoreFromRatio (compute-wellness.ts:17-22) for the "lower is better" branch returns
      (target/value)*100, and the call sites pass the IDEAL as `value` and the ACTUAL as
      `target`:
        debtScore         = scoreFromRatio(30, utilization, false)   // line ~100
        incomeExpenseScore= scoreFromRatio(72, expenseRatio, false)  // line ~102
      Result: HIGHER credit utilization scores BETTER, and LOWER expense ratio scores WORSE —
      both inverted.

      Fix: for lower-is-better metrics the score must DECREASE as the actual value rises, e.g.
      clamp((ideal / max(actual, epsilon)) * 100). Decide a clear (value=actual, target=ideal)
      convention and apply it consistently. Add unit tests: e.g. utilization 10% → high score,
      90% → low score; expenseRatio 50% → high score, 110% → low score.
    acceptance_criteria:
      - Debt-Health score decreases as credit utilization rises
      - Income-to-Expense score decreases as expense ratio rises
      - scoreFromRatio has explicit, documented value/target semantics
      - Unit tests cover both directions with known inputs
