    description: |
      Defect R3 (analytics-architecture.md section 14.2). Bank<->bank savings/checking transfers
      from Teller / SnapTrade / CSV / manual sources are only treated as internal when the upstream
      category is already "Transfers (internal)"; otherwise resolveInternalTransfer catches only
      credit-card payments, so self-transfers from those sources count as income + expense.
      TASK-RECON-001 already reclassifies any pair that the pairer matches. This task handles the
      remainder: (a) add a self-transfer heuristic for legs that look like transfers (opposite-sign,
      matching amount/date, same owner) but were not matched, and (b) surface the count/$ of still
      -unpaired transfer-looking outflows as a data-quality caveat rather than silently counting
      them as spend/income. Keep it conservative to avoid hiding real spend.
    acceptance_criteria:
      - Unmatched same-owner opposite-sign amount/date matches are treated as internal transfers
      - Remaining unpaired transfer-looking outflows are reported as a data-quality caveat
      - No legitimate external spend is reclassified as a transfer (conservative thresholds)
      - typecheck passes
