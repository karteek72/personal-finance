  - id: TASK-ANALYTICS-001
    title: Canonical signed_amount column + cashflow indexes
    status: done
    priority: P1
    area: backend
    phase: 3.7
    assignee: null
    claimed_at: null
    dependencies: []
    source_docs:
      - docs/architecture/analytics-architecture.md
    description: |
      Sign convention is implicit (expenses positive, depository income negative) and abs()
      is sprinkled per-query (defect B14). Add a STORED generated column signed_amount
      (expense -> -abs(amount), income -> +abs(amount), transfer -> 0) and indexes so all
      cashflow SQL can use SUM(signed_amount) with no per-query sign branching.
    acceptance_criteria:
      - Drizzle migration adds transactions.signed_amount GENERATED ALWAYS AS STORED
      - Indexes tx_user_date_idx (user_id,date) and tx_user_cat_date_idx (user_id,category,date)
      - schema.ts reflects the generated column
      - Existing aggregation queries unaffected (column is additive)
