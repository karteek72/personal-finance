  - id: TASK-RECON-001
    title: Reconcile paired transfer legs so KPIs stop double-counting (R1)
    status: done
    priority: P1
    area: backend
    phase: 3.8
    assignee: null
    claimed_at: null
    dependencies: []
    source_docs:
      - docs/architecture/analytics-architecture.md
      - backend/src/services/transfer-pairing.ts
      - backend/src/services/transfer-classification.ts
      - backend/src/services/plaid/sync.ts
      - backend/src/services/teller/sync.ts
      - backend/src/services/snaptrade/sync.ts
    description: |
      Defect R1 (analytics-architecture.md section 14.2). transfer_links is computed by
      refreshTransferLinks after every sync, but the spend/income KPIs exclude transfers ONLY via
      the per-transaction is_transfer flag — transfer_links is consumed only for brokerage
      contributions. So a transfer whose two legs are paired with high confidence but where one leg
      is still typed income/expense (the credit-card payment CREDIT leg, and bank<->bank transfers
      from non-Plaid sources) still double-counts spend or inflates income.
      Fix: after refreshTransferLinks builds the links, run an idempotent reconcile pass that, for
      every link above a confidence threshold (e.g. >= 0.6), sets BOTH referenced legs
      (outflowTxnId and inflowTxnId) to is_transfer=true and transactionType="transfer". Use a
      category of "Transfers (internal)" with subCategory "Credit Card Payments" for cc_payment
      links and a sensible bank-transfer subcategory for bank_bank. Do NOT touch the brokerage
      (investment_transactions) leg. Make it run inside/after refreshTransferLinks so all three sync
      paths get it, and ensure re-running does not flip-flop values. Because every existing
      analytics query already filters is_transfer=false, this single change removes double-counting
      across spend, categories, money-flow, wellness, and audits at once — and gives iOS reconciled
      data with no client logic.
    acceptance_criteria:
      - High-confidence transfer_links cause both transaction legs to be marked is_transfer=true and type transfer
      - Credit-card payment credit legs and bank<->bank self-transfers no longer appear in spend or income totals
      - The pass is idempotent (running twice changes nothing) and only runs server-side
      - The brokerage leg of bank_brokerage links is left unchanged
      - typecheck passes
  - id: TASK-RECON-002
