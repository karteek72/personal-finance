    description: |
      Defect F1 (analytics-architecture.md section 16). computeFireProjection seeds the starting
      portfolio with currentNetWorth = computeLiveNetWorth (checking + savings + cash + investments
      - debts) and grows the whole thing at the real return toward the 25x target. The 4% safe-
      withdrawal target assumes a liquid INVESTED portfolio, so including cash buffers and non-
      retirement assets makes years-to-FIRE far too short (e.g. "1.9 years" for a 42-year-old).
