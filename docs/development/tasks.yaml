      - docs/design/api-contract.md
    description: |
      "Savings rate" is defined 4 different ways across services (defect B13). Create
      services/metrics/ with one exported function per metric (single definition), each
      returning the metric envelope {value, unit, grain, asOf, class, basis, confidence,
      trend, caveats}. Other services must consume the metric layer, never re-query raw tables.
    acceptance_criteria:
      - services/metrics/ with typed MetricEnvelope (no any)
      - Single savingsRate, freeCashFlow, burnRate, emergencyMonths implementations
      - Savings/return rates emitted as 0-1 fraction with unit:"percent"
      - compute-wellness / compute-wrapped / transaction-store reuse the metric layer
      - Unit tests with a golden transaction dataset -> expected values

