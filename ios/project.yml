name: SpendFlow
options:
  bundleIdPrefix: com.mx
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: top
  generateEmptyDirectories: true

packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "8.0.0"

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  SpendFlow:
    type: application
    platform: iOS
    sources:
      - path: SpendFlow
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        INFOPLIST_FILE: SpendFlow/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: SpendFlow/Resources/SpendFlow.entitlements
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        INFOPLIST_KEY_CFBundleDisplayName: SpendFlow
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_APIBaseURL: $(API_BASE_URL)
        INFOPLIST_KEY_GoogleClientID: $(GOOGLE_CLIENT_ID)
        INFOPLIST_KEY_GoogleServerClientID: $(GOOGLE_SERVER_CLIENT_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: Primary
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift

  SpendFlowTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - SpendFlowTests
    dependencies:
      - target: SpendFlow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PRODUCT_BUNDLE_IDENTIFIER).tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  SpendFlow:
    build:
      targets:
        SpendFlow: all
    test:
      targets:
        - SpendFlowTests
    run:
      config: Debug
